# List of Jarvis projects
jarvis_projects:
  - name: "Cluster Monitor"
    git_url: "/linux_sql"
    description: "Built a Bash-based hardware monitoring application that automates the collection of Linux server metrics, including CPU usage, memory availability, and host details. Persisted the collected usage data into a containerized PostgreSQL database managed through Docker for performance tracking. Documented application architecture, data flow, and operating procedures to support reliable system observability and resource management."
  - name: "RDBMS & SQL"
    git_url: "/sql"
    description: "Analyzed a resort dataset containing facility, reservation, and member information by organizing the data into a relational PostgreSQL database running on Docker, and translating business questions into SQL queries."
  - name: "Business Requirements Document"
    git_url: "/rbc_gam"
    description: "Produced a comprehensive Business Requirements Document for a proposed RBC Global Asset Management reporting solution that consolidated data from five source systems into an executive dashboard. Documented business objectives, stakeholders, functional specifications, non-functional requirements, and data governance controls for daily reporting refreshes. Translated complex financial reporting needs into implementation-ready requirements for technical development teams. "
  - name: "Software Requirements Specification"
    git_url: "/stockquote"
    description: "Led stakeholder elicitation sessions to define functional and non-functional requirements for a self-serve retail stock trading front-end, producing a comprehensive Software Requirements Document (SRD). Modeled core entities for trade transactions, mapped system dependencies against existing bank execution engines, and established pre-trade buying power validation rules. Documented order lifecycle states, market closure exception workflows, and data-drift risks to deliver implementation-ready specs for development teams."
  - name: "Python Data Analytics"
    git_url: "/python_data_analytics"
    description: "Analyzed two years of e-commerce transactional data for the London Gift Shop using Python (Pandas) and SQL to perform RFM customer segmentation, evaluate Q4 revenue seasonality, and identify growth opportunities across international buyer segments."
